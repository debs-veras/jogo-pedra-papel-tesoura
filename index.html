<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/css/styles.css" />
    <title>Document</title>
    <title>Pedra, Papel e Tesoura</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <h1>Pedra, Papel e Tesoura</h1>
      <p class="subtitle">O clássico jogo de estratégia e sorte</p>

      <div class="mode-select">
        <button class="btn" onclick="setMode('cpu')">
          <i class="fas fa-robot"></i> Jogar contra Máquina
        </button>
        <button class="btn" onclick="setMode('pvp')">
          <i class="fas fa-user-friends"></i> Jogar contra Player 2
        </button>
      </div>

      <div id="game-container" class="hidden">
        <div class="game-area">
          <div class="player">
            <h3 id="player1-title">Player 1</h3>
            <div id="player1" class="choices"></div>
            <div class="selection">
              <span id="p1-selection">Escolha: -</span>
            </div>
          </div>

          <div class="vs">VS</div>

          <div class="player">
            <h3 id="player2-title">Player 2</h3>
            <div id="player2" class="choices"></div>
            <div class="selection">
              <span id="p2-selection">Escolha: -</span>
            </div>
          </div>
        </div>

        <div class="result" id="resultado"></div>

        <button
          id="reset-btn"
          class="btn reset-btn hidden"
          onclick="resetGame()"
        >
          <i class="fas fa-redo"></i> Jogar Novamente
        </button>
      </div>
    </div>
  </body>
  <script src="src/js/jogo.js"></script>
</html>
